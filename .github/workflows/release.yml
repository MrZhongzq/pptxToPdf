name: 发布镜像

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: deploy/api.Dockerfile
          - name: worker
            dockerfile: deploy/worker.Dockerfile
          - name: frontend
            dockerfile: deploy/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4

      # QEMU 让 amd64 的 runner 也能构建 arm64 —— Oracle 的免费实例是
      # Ampere（aarch64），只推 amd64 的话它 docker pull 会直接
      # "no matching manifest for linux/arm64/v8"。发布镜像才会暴露这个，
      # 本机构建时永远碰不到。
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN 就够，不需要额外配密钥——这正是选 ghcr 的理由
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            # semver 会剥掉 v 前缀：v1.0.0 -> 1.0.0
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 再留一份与 git tag 完全同名的，否则照着 tag 名 pull 会
            # manifest unknown——这正是第一次发布时踩的
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # api 与 worker 共用同一个 base 阶段，缓存能省掉重复的
          # LibreOffice 安装（那一层要好几分钟）
          cache-from: type=gha
          cache-to: type=gha,mode=max

  translate:
    name: 补齐机器翻译
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Argos 在本地跑，不需要任何 API key——这正是换掉云翻译服务的理由：
      # 一个补 UI 文案的辅助脚本不该因为服务商改政策就整条失效。
      - name: 装 Argos Translate
        run: pip install argostranslate

      # 每门语言的模型约 100 MB，缓存住能省掉每次几分钟的下载
      - name: 缓存翻译模型
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-${{ hashFiles('frontend/scripts/translate_locales.py') }}

      - name: 从 en.json 生成其余语言
        run: python frontend/scripts/translate_locales.py

      - name: 有变化就提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/i18n/locales
          git diff --staged --quiet || git commit -m "chore(i18n): 补齐机器翻译"
          git push
