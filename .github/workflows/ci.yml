name: CI

on:
  push:
    branches: [master, 'phase*']
  pull_request:
    branches: [master]

# 同一分支的新推送取消上一次仍在跑的 —— 后端全量要两分钟，排队没有意义
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 装依赖
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: 跑测试
        working-directory: backend
        run: python -m pytest tests/ -q

      - name: 契约快照没漂移
        working-directory: backend
        run: |
          python -m scripts.dump_openapi
          git diff --exit-code openapi.json \
            || (echo "::error::openapi.json 与代码不一致，跑一次 python -m scripts.dump_openapi 并提交" && exit 1)

  frontend:
    name: 前端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装依赖
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: 测试
        working-directory: frontend
        run: npm test -- --run

      - name: 构建
        working-directory: frontend
        run: npm run build

      - name: 语言文件与 en.json 对齐
        working-directory: frontend
        run: node scripts/translate-locales.mjs --check

  compose:
    name: Compose 配置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 docker-compose.yml
        # 需要一个 .env 才能解析变量插值；这里给一份最小的假配置
        run: |
          cp .env.example .env
          docker compose config -q
