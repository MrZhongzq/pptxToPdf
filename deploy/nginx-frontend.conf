server {
    listen 80;
    server_name _;

    # 分片上传后单次请求体只有 5 MiB，无需为 500MB 放宽。
    # 留 16m 余量覆盖块加请求头。改大它没有好处，只会削弱防护。
    client_max_body_size 16m;
    client_body_timeout 120s;

    # docker 内建 DNS。配合下面 proxy_pass 里的变量写法，让 upstream 在
    # **每次请求时**重新解析。
    #
    # 不这么做的话，nginx 只在启动时解析一次 `api` 这个名字并把 IP 记死：
    # 重建 api 容器（docker compose up -d 会换容器 IP）之后，整站所有
    # /api/* 请求全部 502，而 api 自己完全正常。六期真机上踩过一次，
    # 故障表现极具误导性——看起来像后端挂了，实际只是 nginx 拿着过期地址。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA：静态资源找不到时回落到 index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 变量形式的 proxy_pass 才会走上面的 resolver 做运行时解析
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件下载不缓冲，避免占满内存
        proxy_buffering off;
        # 转换是几十秒到几分钟的活，轮询与下载都要留足时间
        proxy_read_timeout 300s;
    }

    # 字体是整份文件一次 multipart 提交，不像 pptx 那样分片，所以上面
    # 那个 16m 挡不住它——真机实测 19MB 的 msyh.ttc 直接吃 413。
    # 单独放宽这一个端点，而不是整体调大 /api/：其余端点没有大 body 的
    # 理由，无差别放宽只是白白扩大攻击面。
    # 故意比后端 admin_fonts.py 里的 MAX_FONT_BYTES（64 MiB）大 1m，而不是
    # 完全对齐：nginx 这个限制管的是整个 multipart body（文件内容 + 边界
    # + 表单字段），后端那个限制管的是文件内容本身。两者恰好相等的话，
    # 64 MiB 的字体会先被 nginx 以裸 HTML 413 拒掉，前端 parseError 解不出
    # JSON，管理员看到的是干巴巴的 HTTP 413，而不是「字体文件不能超过
    # 64 MB」——留 1m 余量让请求先进后端，由后端出友好文案。
    location = /api/admin/fonts/preflight {
        client_max_body_size 65m;

        # 精确匹配的 location 不继承上面 /api/ 的配置，proxy 相关设置要
        # 照抄一份——包括变量形式的 proxy_pass，理由同上（运行时解析）。
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 七期的 HTTP v1 接口。必须单独代理——不加这条的话 /v1/convert 会落进
    # 上面的 SPA 兜底，返回 index.html 和一个 200，调用方拿到一坨 HTML
    # 却以为转换成功了。真机验证时就是这么发现的。
    location /v1/ {
        set $v1_upstream http://api:8000;
        proxy_pass $v1_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        # v1 是同步接口：下载 + 转换 + 后处理全程挂着这一个连接。
        # 一份 150 页的 deck 走 LibreOffice 就要 20 秒以上，加上外部下载
        # 与切片合并，300s 不够用。
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
